name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: npm run package
      - run: npm install --prefix .tools playwright@1.64.1 --no-audit --no-fund
      - run: npx --prefix .tools playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:inbox-browser
      - uses: actions/upload-artifact@v4
        with:
          name: AppTracker-extension
          path: dist/AppTracker
